<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fashion Store - Brief</title>
</head>
<body>

    <header>
        <h1>Fashion Store</h1>
    </header>

    <main>
        <section>
            <h2>Featured Item</h2>
            <div>
                <h3>Stylish Jacket</h3>
                <p>Price: $59.99</p>
                <button>Add to Cart</button>
            </div>
        </section>

        <section>
            <h2>Upcoming Sale</h2>
            <table border="1">
                <tr><th>Event</th><th>Discount</th></tr>
                <tr><td>Flash Sale</td><td>25% Off</td></tr>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Fashion Store.</p>
    </footer>

</body>
</html>
